<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Portfolio - Marwane</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    body, h1,h2,h3,h4,h5,h6 {font-family: "Montserrat", sans-serif}
    .w3-row-padding img {margin-bottom: 12px}
    .w3-sidebar {width: 120px; background: #222;}
    #main {margin-left: 120px}
    @media only screen and (max-width: 600px) { #main {margin-left: 0} }
  </style>
</head>

<body class="w3-black">

  <!-- Sidebar -->
  <nav class="w3-sidebar w3-bar-block w3-small w3-hide-small w3-center">
    <img src="mafioso2.png" style="width:100%" alt="Avatar">

    <a href="#home" class="w3-bar-item w3-button w3-padding-large w3-black">
      <i class="fa fa-home w3-xxlarge"></i><p>HOME</p>
    </a>
    <a href="#about" class="w3-bar-item w3-button w3-padding-large w3-hover-black">
      <i class="fa fa-user w3-xxlarge"></i><p>ABOUT</p>
    </a>
    <a href="#photos" class="w3-bar-item w3-button w3-padding-large w3-hover-black">
      <i class="fa fa-eye w3-xxlarge"></i><p>PHOTOS</p>
    </a>
    <a href="#contact" class="w3-bar-item w3-button w3-padding-large w3-hover-black">
      <i class="fa fa-envelope w3-xxlarge"></i><p>CONTACT</p>
    </a>
  </nav>

  <!-- Mobile navbar -->
  <div class="w3-top w3-hide-large w3-hide-medium">
    <div class="w3-bar w3-black w3-opacity w3-center w3-small">
      <a href="#home" class="w3-bar-item w3-button" style="width:25%">HOME</a>
      <a href="#about" class="w3-bar-item w3-button" style="width:25%">ABOUT</a>
      <a href="#photos" class="w3-bar-item w3-button" style="width:25%">PHOTOS</a>
      <a href="#contact" class="w3-bar-item w3-button" style="width:25%">CONTACT</a>
    </div>
  </div>

  <!-- Content -->
  <div class="w3-padding-large" id="main">

    <!-- Home -->
    <header class="w3-container w3-center w3-padding-32" id="home">
      <h1 class="w3-jumbo"><span class="w3-hide-small">I'm</span> Marwane.</h1>
      <p>Jsp.</p>
      <img src="canvas.png" class="w3-image">
    </header>

    <!-- About -->
    <div class="w3-content w3-text-grey w3-padding-64" id="about">
      <h2 class="w3-text-light-grey">My Name</h2>
      <hr style="width:200px" class="w3-opacity">
      <p>inshallah y'aura some text abt me</p>

      <h3 class="w3-text-light-grey w3-padding-16">My Skills</h3>

      <p class="w3-wide">Games</p>
      <div class="w3-white"><div class="w3-dark-grey" style="height:28px;width:80%"></div></div>

      <p class="w3-wide">Website</p>
      <div class="w3-white"><div class="w3-dark-grey" style="height:28px;width:65%"></div></div>

      <p class="w3-wide">Math</p>
      <div class="w3-white"><div class="w3-dark-grey" style="height:28px;width:90%"></div></div>
    </div>

    <!-- Contact -->
    <div class="w3-content w3-text-grey w3-padding-64" id="contact">
      <h2 class="w3-text-light-grey">Contact Me</h2>
      <hr style="width:200px" class="w3-opacity">

      <form id="contactForm">
        <p><input class="w3-input w3-padding-16" type="text" name="name" placeholder="Name" required></p>
        <p><input class="w3-input w3-padding-16" type="email" name="email" placeholder="Email" required></p>
        <p><input class="w3-input w3-padding-16" type="text" name="subject" placeholder="Subject" required></p>
        <p><textarea class="w3-input w3-padding-16" name="message" placeholder="Message" required></textarea></p>

        <p>
          <button class="w3-button w3-light-grey w3-padding-large" type="submit">
            <i class="fa fa-paper-plane"></i> SEND MESSAGE
          </button>
        </p>

        <p id="successMessage" style="display:none; color:lightgreen; font-weight:bold;">
          Message envoyé !
        </p>
      </form>
    </div>

    <!-- Footer -->
    <footer class="w3-content w3-padding-64 w3-text-grey w3-xlarge">
      <p class="w3-medium">
        Powered by <a href="https://www.w3schools.com/w3css/default.asp" target="_blank">w3.css</a>
      </p>
    </footer>

  </div>

  <!-- SCRIPT -->
  <script>
    const form = document.getElementById("contactForm");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function(e) {
      e.preventDefault(); // 🚫 empêche la redirection

      fetch("https://formspree.io/f/mkowngwr", {
        method: "POST",
        body: new FormData(form),
        headers: { "Accept": "application/json" }
      }).then(response => {
        if (response.ok) {
          successMessage.style.display = "block";
          form.reset();
        }
      });
    });
  </script>

</body>
</html>
